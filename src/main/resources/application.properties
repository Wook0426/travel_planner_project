spring.application.name=planner


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/travel_planner?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
